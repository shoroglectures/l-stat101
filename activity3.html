<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورقة عمل: تحليل أسعار المنتجات</title>
    <style>/* نفس التصميم */</style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ورقة عمل: تحليل أسعار المنتجات</h1>
            <h2>(مقاييس النزعة المركزية - الوسط - الوسيط - المنوال)</h2>
        </div>
        
        <div class="section">
            <h3>الجزء الأول: أسعار منتجات التجميل في 3 متاجر</h3>
            <table>
                <thead><tr><th>المنتج</th><th>المتجر أ</th><th>المتجر ب</th><th>المتجر ج</th></tr></thead>
                <tbody id="pricesTable"></tbody>
            </table>
            <button class="btn" onclick="calculateMeasures()">حساب المقاييس</button>
        </div>
        
        <div class="section calculation-section">
            <h3>الجزء الثاني: مقاييس النزعة المركزية</h3>
            <table>
                <thead><tr><th>المقياس</th><th>المتجر أ</th><th>المتجر ب</th><th>المتجر ج</th></tr></thead>
                <tbody>
                    <tr><td>الوسط الحسابي</td><td><input id="meanA" readonly></td><td><input id="meanB" readonly></td><td><input id="meanC" readonly></td></tr>
                    <tr><td>الوسيط</td><td><input id="medianA" readonly></td><td><input id="medianB" readonly></td><td><input id="medianC" readonly></td></tr>
                    <tr><td>المنوال</td><td><input id="modeA" readonly></td><td><input id="modeB" readonly></td><td><input id="modeC" readonly></td></tr>
                </tbody>
            </table>
        </div>
        
        <div class="section">
            <h3>الجزء الثالث: التحليل والمقارنة</h3>
            <textarea id="comparison" rows="4" placeholder="قارني بين المتاجر بناءً على المقاييس وأيها أفضل من حيث الأسعار..."></textarea>
        </div>
    </div>
    
    <script>
        // كود كامل لحساب الوسط والوسيط والمنوال
        function calculateMean(prices) {
            return prices.reduce((a, b) => a + b, 0) / prices.length;
        }
        
        function calculateMedian(prices) {
            const sorted = [...prices].sort((a, b) => a - b);
            const mid = Math.floor(sorted.length / 2);
            return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
        }
        
        function calculateMode(prices) {
            const freq = {};
            prices.forEach(p => freq[p] = (freq[p] || 0) + 1);
            let maxFreq = 0, mode = [];
            for (const [price, count] of Object.entries(freq)) {
                if (count > maxFreq) {
                    maxFreq = count;
                    mode = [parseInt(price)];
                } else if (count === maxFreq) {
                    mode.push(parseInt(price));
                }
            }
            return mode.length === prices.length ? "لا يوجد" : mode.join(", ");
        }
        // ... كود كامل آخر
    </script>
</body>
</html>
